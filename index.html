<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Sherpa — Escape from Tarkov</title>
    <script>
      // сторож пустого окна: если приложение не смонтировалось за 7 с (скрипт не догрузился, WebView2 открылся
      // раньше сервера, чёрный экран после сна) — перезагружаемся, но не больше 3 раз подряд
      try {
        var tries = +(sessionStorage.getItem('sherpa:boot-retry') || 0)
        var retry = function (why) {
          if (tries >= 3) return
          sessionStorage.setItem('sherpa:boot-retry', String(tries + 1))
          console.warn('[sherpa] перезагрузка: ' + why)
          // новый адрес (?r=…), а не reload(): reload() шлёт If-Modified-Since, и сервер другой версии может ответить 304 —
          // страница останется чужой, а её /assets/*.js так и будут 404
          setTimeout(function () {
            var q = new URLSearchParams(location.search); q.set('r', String(Date.now()))
            location.replace(location.pathname + '?' + q.toString() + location.hash)
          }, 800)
        }
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) retry('не загрузился ' + (t.src || t.href))
        }, true)
        setTimeout(function () {
          var root = document.getElementById('root')
          if (!root || root.childElementCount === 0) retry('пустой экран')
          else sessionStorage.removeItem('sherpa:boot-retry')
        }, 7000)
      } catch (e) {}
      // тема до первого кадра — чтобы светлая не мигала тёмным
      try {
        var t = new URLSearchParams(location.search).get('theme') || (JSON.parse(localStorage.getItem('sherpa:ui') || '{}').state || {}).theme
        if (t === 'light' || t === 'dark') { document.documentElement.dataset.theme = t; document.querySelector('meta[name="color-scheme"]').content = t }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
